<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Material Mail local design preview. Not Thunderbird runtime.">
  <title>Material Mail · Local preview</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#preview-main">Skip to preview content</a>
  <div class="preview-shell" id="preview-shell">
    <header class="preview-header">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">✉</span>
        <div>
          <p class="eyebrow">LOCAL MATERIAL PREVIEW</p>
          <h1>Material Mail</h1>
        </div>
      </div>
      <div class="header-actions">
        <span class="preview-badge" title="This page is a design preview, not the Thunderbird application">PREVIEW · NOT THUNDERBIRD RUNTIME</span>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle dark theme" title="Toggle dark theme">☾</button>
        <button class="avatar-button" type="button" aria-label="Account menu">MO</button>
      </div>
    </header>

    <div class="status-rail" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <strong>Local preview status</strong>
      <span id="status-copy">Design data loaded locally · no native mail process connected.</span>
      <span class="gap-chip">Runtime gap: visual only</span>
    </div>

    <nav class="tab-strip" aria-label="Material Mail preview pages">
      <div class="tabs-scroll" id="tab-list" role="tablist" aria-orientation="horizontal"></div>
      <button class="more-tabs" id="more-tabs" type="button" aria-haspopup="menu" aria-expanded="false" title="Show all preview pages">＋</button>
    </nav>

    <main id="preview-main" class="preview-main" tabindex="-1"></main>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="../../app-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
