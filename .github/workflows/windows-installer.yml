# Builds a Windows Thunderbird installer from this comm checkout and publishes it
# as a non-draft GitHub Release.
#
# This repo is the *comm* tree only — no mach, no mozconfig, no mozilla/. Per
# README.md it must sit at comm/ inside a mozilla-central checkout, so this
# workflow clones mozilla-firefox/firefox and drops this repo in at comm/.
#
# Build mode defaults to ARTIFACT. The 3-pane rewrite only touches frontend files
# (.js/.xhtml/.css/.mjs), which is exactly what artifact builds are for: prebuilt
# C++/Rust binaries are downloaded and only the frontend is compiled and packaged.
# It finishes in minutes and needs ~10 GB.
#
# `full` is selectable via workflow_dispatch and is REQUIRED if a change ever
# touches C++ or Rust. Be warned: a full build needs ~45 GB, and a hosted runner
# has ~14 GB before cleanup. Public repos get unlimited minutes, but that buys
# time, not disk - the SSD size and the 6h job cap are platform limits, not
# billing ones. Full builds want a self-hosted or larger runner.
#
# Dependencies install automatically: `mach bootstrap --no-interactive` fetches
# the Mozilla toolchains, with rustup as belt-and-braces. Nothing prompts.
#
# Two non-obvious facts this workflow is built around, both verified against the
# pinned mozilla-central in vendor/gecko rather than guessed:
#
#  1. MOZ_AUTOMATION=1 is NOT a "be quiet, I'm CI" flag. It is the Taskcluster
#     contract, and outside Taskcluster it actively breaks this build. See the
#     `env:` block for the four separate ways it fails.
#
#  2. On Windows `mach package` DOES produce the NSIS installer. There is no
#     `mach build installer` target any more. toolkit/mozapps/installer/packager.mk
#     `make-package` runs `$(MAKE) -C windows ZIP_IN=... installer` whenever
#     OS_ARCH is WINNT and MOZ_PKG_FORMAT is ZIP, and comm/mail/installer/windows
#     supplies that target via makensis.mk. What it needs is makensis + 7zz on
#     hand, which is what `--enable-bootstrap` is for.

name: Windows installer

on:
  push:
    branches:
      - main
      - 'design-import/**'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'artifact = frontend only (minutes, fits a hosted runner). full = compile everything (hours, needs ~45 GB).'
        type: choice
        default: artifact
        options: [artifact, full]

permissions:
  contents: write

# NO concurrency group, deliberately.
#
# `cancel-in-progress: false` is not enough: it only protects the run that is
# already executing. A run sitting QUEUED in a group is superseded whenever a
# newer run joins that group, so with builds this long and pushes this frequent,
# intermediate commits silently lost their release. Observed twice.
#
# The requirement is a release for every push, so every push gets its own
# independent run. Public repos have generous concurrency limits; let them queue
# naturally instead of eating each other.

jobs:
  build:
    runs-on: windows-latest
    # GitHub caps a hosted job at 6h. Use nearly all of it for a full build.
    timeout-minutes: 355

    env:
      # Build on D:, not C:. Measured on a real run: C: has ~33 GB free, D: has
      # ~147 GB. The documented "14 GB SSD" figure understates this image badly,
      # and D: is roomy enough for a full build (~45 GB) with room to spare.
      #
      # D: on an Azure-backed hosted runner is the temporary/resource disk. It is
      # persistent for the lifetime of the VM, which is the lifetime of THIS job,
      # so everything below is safe. It does NOT survive into a second job: if
      # this workflow ever grows a `needs:` job, that job will not see D:\gecko
      # and everything it wants must be uploaded as an artifact first.
      MOZBUILD_STATE_PATH: D:\mozbuild
      GECKO_DIR: D:\gecko

      # MOZ_AUTOMATION is deliberately NOT set. It used to be, and it is the
      # single biggest reason this pipeline could not have worked. It is the
      # Taskcluster contract, not a generic "this is CI" switch, and off
      # Taskcluster it breaks the build in four independent places:
      #
      #  1. comm/build/moz.configure/gecko_source.configure - `comm_source_repo`
      #     and `gecko_source_repo` call die() when MOZ_AUTOMATION is set and
      #     COMM_HEAD_REPOSITORY / GECKO_HEAD_REPOSITORY are absent. Hard
      #     configure failure: "Unable to determine COMM source repository."
      #  2. mozilla build/moz.configure/init.configure - `vcs_checkout_type`
      #     raises FatalCheckError("unable to resolve VCS type; must run from a
      #     source checkout when MOZ_AUTOMATION is set").
      #  3. mozilla build/moz.configure/bootstrap.configure - `bootstrap_default`
      #     returns False under automation, because Taskcluster is expected to
      #     supply MOZ_FETCHES_DIR. Nothing supplies it here, so nsis, 7zz and
      #     upx are never fetched and packaging dies at the installer step.
      #  4. toolkit/mozapps/installer/windows/nsis/makensis.mk - sets
      #     USE_UPX := --use-upx on `$(UPX)$(MOZ_AUTOMATION)`, i.e. it forces upx
      #     on merely because automation is claimed, even when configure found no
      #     upx at all. exe_7z_archive.py then execs a binary that isn't there.
      #
      # The one thing MOZ_AUTOMATION was buying was silencing mach's desktop
      # notifications and the Defender-exclusion UAC prompt. MOZ_NOSPAM covers
      # the first (mozbuild/base.py checks both) and `bootstrap
      # --no-system-changes` covers the second.
      MOZ_NOSPAM: '1'

      # Keep the mozconfig OFF the default path ($topsrcdir/mozconfig) and point
      # MOZCONFIG at it instead. This is not cosmetic. `mach bootstrap` ends in
      # _output_mozconfig(); if a mozconfig exists at the default path it calls
      # _check_default_mozconfig_mismatch(), sees "browser" != "comm_mail", and
      # asks "Do you want to overwrite the config?" - and mozboot's prompt_yesno
      # returns True unconditionally when non-interactive. It would silently
      # replace our comm/mail artifact mozconfig with an empty one and we would
      # spend six hours building, and then shipping, Firefox. mozboot's
      # find_mozconfig() honours $MOZCONFIG first, and the mismatch path is only
      # reached when the default path exists, so this sidesteps it entirely.
      # Must be a literal: GitHub does not expand env into env.
      MOZCONFIG: D:\gecko\mozconfig-ci

    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          # mozilla-central contains web-platform test paths well over Windows'
          # 260-char MAX_PATH. Without this the gecko clone dies partway through
          # with a wall of "Filename too long" and leaves a half-checked-out tree.
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null
          Write-Host "core.longpaths = $(git config --system --get core.longpaths)"

      - name: Disk space (before)
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table

      - name: Reclaim disk space
        shell: pwsh
        continue-on-error: true
        run: |
          # Only worth doing when the build drive is actually tight. Measured on a
          # real run this deletion takes ~4.5 minutes, and D: already has ~147 GB
          # free — so on this image it is usually 4.5 minutes bought for nothing.
          $buildDrive = "$env:GECKO_DIR".Substring(0,1)
          $free = [math]::Round((Get-PSDrive $buildDrive).Free / 1GB, 1)
          if ($free -ge 60) {
            Write-Host "Build drive ${buildDrive}: has $free GB free - skipping cleanup."
            exit 0
          }
          Write-Host "Build drive ${buildDrive}: has only $free GB - reclaiming space."
          $targets = @(
            "$env:ProgramFiles\dotnet",
            "${env:ProgramFiles(x86)}\Android",
            "$env:ProgramFiles\Microsoft SDKs\Android",
            "$env:ProgramFiles\Google\Chrome",
            "${env:ProgramFiles(x86)}\Google",
            "$env:ProgramFiles\Microsoft\jdk",
            "$env:ProgramFiles\PostgreSQL",
            "$env:ProgramFiles\MySQL",
            "$env:ProgramFiles\MongoDB",
            "$env:ProgramFiles\R",
            "$env:AGENT_TOOLSDIRECTORY\Ruby",
            "$env:AGENT_TOOLSDIRECTORY\go",
            "$env:AGENT_TOOLSDIRECTORY\CodeQL",
            "$env:AGENT_TOOLSDIRECTORY\node",
            "$env:LOCALAPPDATA\Android",
            "C:\hostedtoolcache\windows\Java*",
            "C:\Program Files\Unity"
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              $sz = 0
              try { $sz = (Get-ChildItem $t -Recurse -File -EA SilentlyContinue | Measure-Object Length -Sum).Sum/1GB } catch {}
              Remove-Item -Recurse -Force $t -EA SilentlyContinue
              Write-Host ("Removed {0} ({1:N1} GB)" -f $t, $sz)
            }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table

      - name: Check out comm (this repo)
        uses: actions/checkout@v4
        with:
          path: comm-src
          # NOT fetch-depth: 1. An artifact build of comm/mail resolves its
          # prebuilt binaries against the *comm* history, not gecko's:
          # mozbuild/artifact_commands.py does
          #   topsrcdir = substs.get("commtopsrcdir", topsrcdir)
          # and artifacts.py then runs `git rev-list --topo-order --max-count=500`
          # in that directory and asks the Taskcluster index for each revision.
          # With depth 1 the only revision on offer is this fork's own tip, which
          # comm-central CI has obviously never built, and `mach artifact install`
          # aborts with "Could not find any candidate pushheads". 500 gives the
          # walk enough real comm-central ancestors to land on a nightly that was
          # actually built, and matches NUM_REVISIONS_TO_QUERY exactly so nothing
          # is fetched that would not be looked at.
          fetch-depth: 500
          # Submodules are fetched selectively below: vendor/gecko is multi-GB and
          # vendor/agent-global-memory is irrelevant to building.
          submodules: false

      - name: Obtain gecko
        shell: pwsh
        working-directory: ${{ github.workspace }}\comm-src
        run: |
          # Fetch the pinned gecko revision DIRECTLY into $GECKO_DIR. Nothing is
          # moved, which is the whole point.
          #
          # A submodule has TWO relative pointers and moving its worktree breaks
          # both, one after the other:
          #   1. the worktree's .git FILE -> `gitdir: ../../.git/modules/...`
          #   2. that gitdir's `core.worktree` -> `../../../../vendor/gecko`
          # Fixing (1) by relocating the gitdir just exposes (2):
          #   fatal: cannot chdir to '../../../../vendor/gecko'
          # Both observed on real runs. Fetching straight to the destination has
          # neither pointer to break.
          #
          # gecko MUST remain a real git checkout - this is not cosmetic:
          #   * init.configure's vcs_checkout_type() is a plain
          #     os.path.exists(topsrcdir/.git) test. No .git, and
          #     VCS_CHECKOUT_TYPE and GIT never reach substs.
          #   * without GIT, mozbuild/base.py falls back to SrcRepository,
          #     artifact_commands.py sets git=None and hg=None, and
          #     artifacts.py::_get_recent_public_revisions() then calls run_hg()
          #     with self._hg = None -> TypeError, mid-build.
          #   * bootstrap.configure shells out to `mach taskgraph tasks` for
          #     toolchains; no repo, no taskgraph, no nsis/7zz, no installer.
          $geckoUrl = "https://github.com/mozilla-firefox/firefox.git"
          $rev = ""
          $pinned = $false

          # The pinned SHA lives in this repo's tree as a gitlink entry.
          $entry = (git ls-tree HEAD vendor/gecko) 2>$null
          if ($entry -and $entry -match '^\s*\d+\s+commit\s+([0-9a-f]{40})') {
            $rev = $Matches[1]
            $pinned = $true
            Write-Host "vendor/gecko pins gecko at $rev"
          } else {
            Write-Host "::notice::vendor/gecko gitlink not found - using mozilla-central tip (unpinned)."
          }

          git init --quiet "$env:GECKO_DIR"
          git -C "$env:GECKO_DIR" remote add origin $geckoUrl

          if ($pinned) {
            # GitHub permits fetching an exact commit, so a shallow pinned fetch
            # needs no history and no branch.
            git -C "$env:GECKO_DIR" fetch --depth 1 --quiet origin $rev
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::pinned fetch of $rev failed; falling back to tip."
              $pinned = $false
            } else {
              git -C "$env:GECKO_DIR" checkout --quiet --detach FETCH_HEAD
              if ($LASTEXITCODE -ne 0) { throw "checkout of pinned $rev failed" }
            }
          }
          if (-not $pinned) {
            git -C "$env:GECKO_DIR" fetch --depth 1 --quiet origin HEAD
            if ($LASTEXITCODE -ne 0) { throw "could not fetch gecko from $geckoUrl" }
            git -C "$env:GECKO_DIR" checkout --quiet --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw "checkout of gecko tip failed" }
          }

          if (-not (Test-Path (Join-Path $env:GECKO_DIR "mach"))) {
            throw "gecko checkout has no mach - fetch produced an unusable tree"
          }
          if (-not (Test-Path (Join-Path $env:GECKO_DIR ".git"))) {
            throw "gecko has no .git - vcs_checkout_type() would fail and the build would break later, confusingly"
          }
          $head = (git -C "$env:GECKO_DIR" rev-parse HEAD).Trim()
          if (-not $head) { throw "could not determine gecko revision" }
          Write-Host "gecko rev: $head (pinned: $pinned)"
          "### Gecko: ``$head`` (pinned: $pinned)" >> $env:GITHUB_STEP_SUMMARY

      - name: Assemble gecko/comm tree
        shell: pwsh
        run: |
          # Build layout is gecko/comm; gecko has already been lifted to $GECKO_DIR.
          Move-Item -Path "${{ github.workspace }}\comm-src" -Destination "$env:GECKO_DIR\comm"
          if (-not (Test-Path "$env:GECKO_DIR\comm\mail\config\version.txt")) {
            throw "comm/ not placed correctly - mail/config/version.txt missing"
          }
          if (-not (Test-Path "$env:GECKO_DIR\mach")) {
            throw "gecko/ missing mach - checkout did not populate"
          }
          # The comm checkout must keep its own .git: it is what `mach artifact
          # install` walks to find a comm-central revision with a published
          # win64-opt build. actions/checkout gives us a real .git directory
          # here (not a submodule pointer), so nothing to repair - just assert.
          if (-not (Test-Path "$env:GECKO_DIR\comm\.git")) {
            throw "comm/.git is missing - artifact builds cannot resolve a candidate revision without it"
          }
          "COMM_HEAD_REPOSITORY=${{ github.server_url }}/${{ github.repository }}" >> $env:GITHUB_ENV
          "COMM_HEAD_REV=${{ github.sha }}" >> $env:GITHUB_ENV
          Write-Host "Thunderbird version: $(Get-Content "$env:GECKO_DIR\comm\mail\config\version.txt")"

      - name: Choose build mode from measured free space
        id: mode
        shell: pwsh
        run: |
          # A full mozilla-central build needs ~40-50 GB (source ~5, objdir ~30-40,
          # toolchains ~5). A hosted runner rarely has that even after cleanup, so
          # measure rather than assume — a 3-hour build that dies on disk at the end
          # is the worst outcome available. An explicit workflow_dispatch choice wins.
          # Measure the drive we actually build on (D:), not C:.
          $buildDrive = "$env:GECKO_DIR".Substring(0,1)
          $free = [math]::Round((Get-PSDrive $buildDrive).Free / 1GB, 1)
          $requested = "${{ github.event.inputs.build_mode }}"
          $FULL_NEEDS_GB = 45
          $mode = if ($requested) { $requested } else { 'artifact' }
          Write-Host "Build drive ${buildDrive}: $free GB free"

          if ($mode -eq 'full' -and $free -lt $FULL_NEEDS_GB) {
            Write-Host "::warning::Full build requested but only $free GB free (needs ~$FULL_NEEDS_GB GB). Proceeding as asked - expect an out-of-disk failure. A self-hosted or larger runner is the fix."
          }
          Write-Host "Build mode: $mode (free: $free GB)"
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "### Build mode: ``$mode`` (free disk: $free GB)" >> $env:GITHUB_STEP_SUMMARY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          # mach bootstrap installs this too; doing it up front makes a failure
          # here obvious instead of surfacing as a confusing bootstrap error.
          rustup set profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version; cargo --version

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          # Windows mach hard-asserts on MozillaBuild's presence:
          #   AssertionError: MozillaBuild was not found at "C:\mozilla-build".
          # It is not on hosted runners, and bootstrap cannot install it because
          # mach refuses to start without it. So it goes in first, from Mozilla's
          # own FTP, silently.
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe"
          $exe = "$env:RUNNER_TEMP\MozillaBuildSetup.exe"
          Write-Host "Downloading MozillaBuild..."
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          Write-Host ("Downloaded {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))
          # NSIS installer: /S is silent, /D must be last and unquoted.
          Start-Process -FilePath $exe -ArgumentList '/S','/D=C:\mozilla-build' -Wait -NoNewWindow
          if (-not (Test-Path "C:\mozilla-build")) {
            throw "MozillaBuild did not install to C:\mozilla-build"
          }
          "MOZILLABUILD=C:\mozilla-build" >> $env:GITHUB_ENV
          Write-Host "MozillaBuild installed:"
          Get-ChildItem "C:\mozilla-build" | Select-Object -First 8 Name | Format-Table -AutoSize

      - name: Write mozconfig
        shell: pwsh
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          # Written to $MOZCONFIG (D:\gecko\mozconfig-ci), NOT $topsrcdir/mozconfig.
          # See the note in the job `env:` block - bootstrap will silently
          # overwrite the default path.
          $lines = @(
            # This is the line that makes it a Thunderbird build rather than a
            # Firefox one, and it has to be present at *configure* time, not at
            # bootstrap time. It is what puts MOZ_BUILD_APP=comm/mail into substs,
            # which is the sole trigger for artifacts.py picking
            # ThunderbirdJobConfiguration over the Gecko one.
            'ac_add_options --enable-project=comm/mail',
            'ac_add_options --disable-tests',
            # Fetch Mozilla's own nsis, 7zz and upx into MOZBUILD_STATE_PATH.
            # `mach package` on Windows runs the NSIS installer target, and
            # moz.configure declares those three as check_prog(..., bootstrap=...,
            # allow_missing=True). Without bootstrap they resolve to nothing, the
            # makensis.mk recipe execs `installer.nsi` as if it were a program,
            # and packaging dies after the build has already been paid for.
            # Note 7Z is looked up as `7zz`, not `7z`, so the 7-Zip that ships on
            # the runner image does not satisfy it.
            # This is on by default off-automation for a nightly VCS checkout, but
            # only because both of those conditions hold; state it explicitly so
            # it cannot regress silently.
            'ac_add_options --enable-bootstrap',
            # @TOPSRCDIR@ is D:\gecko, so this resolves to D:\gecko\obj-tb.
            # Every later step uses $env:GECKO_DIR\obj-tb; keep the two in step.
            'mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-tb',
            'mk_add_options AUTOCLOBBER=1'
          )
          if ($env:MODE -eq 'artifact') {
            # Implies --disable-compile-environment (mozilla moz.configure
            # imply_disable_compile_environment), so no MSVC toolchain checks run.
            $lines += 'ac_add_options --enable-artifact-builds'
          } else {
            # ONLY for a full build. Both of these live behind the compile
            # environment, so under --enable-artifact-builds configure rejects
            # them outright:
            #   InvalidOptionError: --enable-optimize is not available in this
            #   configuration
            # Observed on a real run - it fails at configure, after bootstrap has
            # already downloaded the toolchains, so the cost is paid before the
            # error appears.
            $lines += 'ac_add_options --enable-optimize'
            $lines += 'ac_add_options --disable-debug'
          }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $env:MOZCONFIG) | Out-Null
          $lines -join "`n" | Set-Content -Encoding ascii $env:MOZCONFIG
          Write-Host "--- $env:MOZCONFIG (mode: $env:MODE) ---"
          Get-Content $env:MOZCONFIG
          if (Test-Path "$env:GECKO_DIR\mozconfig") {
            throw "a mozconfig exists at the default path; bootstrap would overwrite it. Remove it."
          }

      - name: Bootstrap build environment (auto-install deps)
        shell: pwsh
        working-directory: ${{ env.GECKO_DIR }}
        run: |
          # MOZILLABUILD is already exported (see the install step above), and
          # that matters for two reasons beyond mach's own assertion:
          #   * build/mach_initialize.py::_maybe_activate_mozillabuild_environment
          #     prepends MozillaBuild's msys2 tools and bin/ to PATH, which is
          #     what gives the build a usable `make`, `sh`, etc.
          #   * mozboot/bootstrap.py dispatches on it - with MOZILLABUILD set it
          #     picks MozillaBuildBootstrapper, without it WindowsBootstrapper.
          # So there is no need to re-enter start-shell.bat; running mach from
          # pwsh with MOZILLABUILD set is the supported path.
          #
          # --application-choice=browser is correct for comm/mail. mozboot's
          # APPLICATIONS map has no Thunderbird entry at all, and bootstrap does
          # not read our mozconfig: auto_bootstrap() builds its own argv with
          # `--enable-project=browser` and MOZCONFIG=/dev/null. It is fetching
          # host toolchains, which comm shares with Firefox. Picking
          # browser_artifact_mode instead would only skip clang-tidy and sccache
          # while adding a mozconfig-mismatch code path, so it buys nothing.
          #
          # --no-system-changes stops mozboot calling ShellExecuteW(..., "runas")
          # to add Microsoft Defender exclusions. That fires a UAC consent dialog
          # no one on a hosted runner can answer. It was previously suppressed by
          # MOZ_AUTOMATION, which we have removed. It does not reduce what gets
          # installed: maybe_install_private_packages_or_exit() -> auto_bootstrap()
          # still runs first, and that is the part that downloads the toolchains.
          python mach --no-interactive bootstrap --application-choice=browser --no-system-changes
          if ($LASTEXITCODE -ne 0) { throw "mach bootstrap failed ($LASTEXITCODE)" }

      - name: Configure
        shell: pwsh
        working-directory: ${{ env.GECKO_DIR }}
        run: |
          # Split out from `mach build` so a configure failure is legible, and so
          # the packaging tools can be inspected before hours are spent building.
          python mach configure
          if ($LASTEXITCODE -ne 0) { throw "mach configure failed ($LASTEXITCODE)" }

          $cs = Join-Path $env:GECKO_DIR "obj-tb\config.status"
          if (-not (Test-Path $cs)) { throw "configure produced no config.status at $cs" }
          # Early warning for the packaging step. `mach package` shells out to
          # makensis and 7zz to build the installer; if configure resolved
          # neither, the failure would otherwise arrive at the very end.
          # config.status is a pprint'ed python dict, so entries read
          #   'MAKENSISU': 'D:\\mozbuild\\nsis\\bin\\makensis.exe',
          # An absent key or an empty value both mean the tool was not found,
          # because these are declared allow_missing=True in moz.configure.
          foreach ($tool in 'MAKENSISU','7Z','UPX') {
            $hit = Select-String -Path $cs -Pattern "'$tool'" -SimpleMatch -EA SilentlyContinue | Select-Object -First 1
            if ($hit -and $hit.Line -notmatch "'$tool':\s*''") {
              Write-Host ("{0}: {1}" -f $tool, $hit.Line.Trim())
            } else {
              Write-Host "::warning::configure did not resolve $tool. mach package builds the Windows installer with makensis and 7zz, so packaging will very likely fail. Check that --enable-bootstrap took effect and that mach taskgraph could run."
            }
          }
          Select-String -Path $cs -Pattern "MOZ_BUILD_APP|MOZ_ARTIFACT_BUILDS|MOZ_APP_NAME" -EA SilentlyContinue |
            ForEach-Object { Write-Host $_.Line.Trim() }

      # ---------------------------------------------------------------------
      # UNRESOLVED RISKS - read before debugging the next red run.
      #
      # Everything above is a fix I could verify against the pinned tree in
      # vendor/gecko. The following I could not verify without a live run, so
      # they are documented rather than guessed at.
      #
      # RISK 1 - artifact lookup may be keyed on Mercurial changesets, not git.
      #   mozbuild/artifacts.py::TaskCache.artifacts builds the index namespace
      #     comm.v2.comm-central.shippable.revision.<REV>.thunderbird.win64-opt
      #   For a git checkout with no git-cinnabar metadata (ours), <REV> is fed
      #   raw git SHAs straight out of `git rev-list`. That is only correct if
      #   comm-central's Taskcluster index is populated with git SHAs. If comm
      #   is still hg-primary for indexing, every lookup 404s and the failure
      #   reads "Could not find any candidate pushheads in the last 50
      #   revisions" - which looks like a fetch-depth problem and is not one.
      #   Increasing fetch-depth will not help. The escape hatches, all read by
      #   artifacts.py::install_from and all settable as job env, are:
      #     MOZ_ARTIFACT_TASK_WIN64_OPT=<taskId>   pin an exact TC task
      #     MOZ_ARTIFACT_URL=<url>                 point at a target.zip
      #     MOZ_ARTIFACT_REVISION=<rev>            force one revision
      #   Prefer MOZ_ARTIFACT_TASK_WIN64_OPT: it needs no revision mapping.
      #
      # RISK 2 - this fork's commit SHAs must actually match comm-central's.
      #   The walk only succeeds if recent ancestors of HEAD are byte-identical
      #   commits to ones comm-central CI built. If this repo was re-created
      #   (squashed, re-authored, imported) rather than forked, the SHAs differ
      #   and no depth will ever find a match. Same escape hatches as RISK 1.
      #
      # RISK 3 - toolchain bootstrap depends on taskgraph generation succeeding.
      #   bootstrap.configure::bootstrap_toolchain_tasks shells out to
      #   `mach taskgraph tasks -k fetch -k toolchain`. gecko here is a depth-1
      #   detached-HEAD clone; if taskgraph cannot derive its parameters from
      #   that, it raises, the exception is swallowed into a log warning, and
      #   nsis/7zz/upx are quietly not fetched. The Configure step above turns
      #   that silence into an explicit ::warning:: - if you see it, this is the
      #   cause, and the fix is a deeper gecko clone, not more mozconfig flags.
      #
      # RISK 4 - artifact/source skew between comm and gecko.
      #   A comm/mail artifact build layers this checkout's frontend over
      #   binaries built by comm-central against whatever mozilla-central
      #   revision comm-central had pinned at that time. vendor/gecko pins its
      #   own, possibly different, mozilla-central revision. For a pure
      #   frontend change this is normally fine, but a mismatch shows up as
      #   missing chrome or XPT/interface errors at runtime rather than as a
      #   build failure. If that happens, move vendor/gecko to the revision in
      #   comm's .gecko_rev.yml.
      # ---------------------------------------------------------------------

      - name: Build
        shell: pwsh
        working-directory: ${{ env.GECKO_DIR }}
        run: |
          # In artifact mode this is where the prebuilt binaries arrive: gecko's
          # Makefile.in has a `recurse_artifact` rule that runs
          # `mach artifact install --no-tests`. Because MOZ_BUILD_APP is
          # comm/mail, that resolves against trust domain `comm`, product
          # `thunderbird` and the comm-central index - NOT mozilla-central. A
          # mozilla-central artifact would be the wrong product entirely.
          python mach build
          if ($LASTEXITCODE -ne 0) { throw "mach build failed ($LASTEXITCODE)" }

      - name: Package installer
        shell: pwsh
        working-directory: ${{ env.GECKO_DIR }}
        run: |
          # There is no `mach build installer` target in current mozilla-central;
          # grep the top-level Makefile.in and it does not exist. On Windows the
          # NSIS installer is a side effect of `make package`: packager.mk's
          # make-package rule runs `$(MAKE) -C windows ZIP_IN=$(PACKAGE) installer`
          # when OS_ARCH=WINNT and MOZ_PKG_FORMAT=ZIP, and comm/mail/installer/
          # windows/Makefile.in provides that target through makensis.mk. Output
          # lands in dist/install/sea/*.installer.exe alongside the plain .zip.
          python mach package
          if ($LASTEXITCODE -ne 0) { throw "mach package failed ($LASTEXITCODE)" }

      - name: Locate installer
        id: find
        shell: pwsh
        working-directory: ${{ env.GECKO_DIR }}
        run: |
          # dist/install/sea/<app>-<version>.<locale>.win64.installer.exe, per
          # toolkit/mozapps/installer/package-name.mk (PKG_INST_PATH/PKG_INST_BASENAME).
          $dist = Join-Path $env:GECKO_DIR "obj-tb\dist"
          $exe = Get-ChildItem -Path (Join-Path $dist "install") -Recurse -Filter "*.exe" -EA SilentlyContinue |
                 Where-Object { $_.Name -match 'installer|setup' } |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) {
            Write-Host "No installer found. $dist contents:"
            Get-ChildItem -Path $dist -Recurse -Depth 3 -EA SilentlyContinue |
              Select-Object FullName | Format-Table -AutoSize
            throw "mach package produced no installer .exe. On Windows the installer is built by the make-package rule (packager.mk), which needs MAKENSISU and 7Z from configure - check the Configure step's warnings and obj-tb\config.log."
          }
          Write-Host ("Installer: {0} ({1:N1} MB)" -f $exe.FullName, ($exe.Length/1MB))
          "installer=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "version=$(Get-Content "$env:GECKO_DIR\comm\mail\config\version_display.txt")" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: pwsh
        env:
          # Per shared instructions: optional repo PAT, then org token, then the
          # ephemeral workflow token as last fallback.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Dim sum code names, cycled by run_number so every build gets one and
          # the sequence is deterministic rather than random.
          $dimsum = @(
            @{ slug='har-gow';       en='Har Gow';       zh='蝦餃';   emoji='🥟' },
            @{ slug='siu-mai';       en='Siu Mai';       zh='燒賣';   emoji='🥟' },
            @{ slug='char-siu-bao';  en='Char Siu Bao';  zh='叉燒包'; emoji='🍞' },
            @{ slug='cheung-fun';    en='Cheung Fun';    zh='腸粉';   emoji='🍥' },
            @{ slug='dan-tat';       en='Dan Tat';       zh='蛋撻';   emoji='🥧' },
            @{ slug='lo-mai-gai';    en='Lo Mai Gai';    zh='糯米雞'; emoji='🍚' },
            @{ slug='wu-gok';        en='Wu Gok';        zh='芋角';   emoji='🥔' },
            @{ slug='fung-zaau';     en='Fung Zaau';     zh='鳳爪';   emoji='🍗' },
            @{ slug='pai-gwat';      en='Pai Gwat';      zh='豉汁排骨'; emoji='🍖' },
            @{ slug='ham-sui-gok';   en='Ham Sui Gok';   zh='鹹水角'; emoji='🥟' },
            @{ slug='ma-lai-go';     en='Ma Lai Go';     zh='馬拉糕'; emoji='🍰' },
            @{ slug='lin-yung-bao';  en='Lin Yung Bao';  zh='蓮蓉包'; emoji='🥮' },
            @{ slug='pei-daan-sou';  en='Pei Daan Sou';  zh='皮蛋酥'; emoji='🥠' },
            @{ slug='zaa-leung';     en='Zaa Leung';     zh='炸兩';   emoji='🌯' },
            @{ slug='dau-fu-fa';     en='Dau Fu Fa';     zh='豆腐花'; emoji='🍮' },
            @{ slug='no-mai-chi';    en='No Mai Chi';    zh='糯米糍'; emoji='🍡' }
          )
          $dish = $dimsum[[int]"${{ github.run_number }}" % $dimsum.Count]

          $sha = "${{ github.sha }}".Substring(0,7)
          $ver = "${{ steps.find.outputs.version }}"
          $run = "${{ github.run_number }}"
          # run_number is monotonic, so tags never collide or recycle.
          $tag   = "tb-$ver-b$run-$($dish.slug)"
          $title = "$($dish.emoji) $($dish.en) · $($dish.zh) — Thunderbird $ver (build $run)"

          $notes = @"
          ## $($dish.emoji) ``$($dish.slug)`` · $($dish.en) · $($dish.zh)

          Unofficial Windows build from ``${{ github.ref_name }}`` @ ``${{ github.sha }}``.

          > [!WARNING]
          > **Not an official Mozilla Thunderbird release.** Built from a fork for the
          > Material Mail 3-pane rewrite. Do not treat it as an upstream Thunderbird build.

          | | |
          |---|---|
          | Code name | $($dish.emoji) $($dish.en) · $($dish.zh) |
          | Version | ``$ver`` |
          | Build | ``$run`` |
          | Commit | ``${{ github.sha }}`` |
          | Build mode | ``${{ steps.mode.outputs.mode }}`` |
          | Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

          **粵** — 呢個係 fork 嘅非官方 Windows build,唔係官方 Thunderbird,唔好搞錯。今次個代號叫「$($dish.zh)」。
          "@

          # Deliberately NOT --draft and NOT --prerelease: every push ships a real,
          # immediately-visible release.
          gh release create "$tag" "${{ steps.find.outputs.installer }}" `
            --repo "${{ github.repository }}" `
            --title "$title" `
            --notes "$notes" `
            --latest
          Write-Host "Published $tag ($($dish.en) / $($dish.zh))"
          "### $($dish.emoji) Released ``$tag`` — $($dish.en) · $($dish.zh)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          # These pointed at C:\gecko, which has not been the build location
          # since the move to D:. Every failed run uploaded an empty artifact.
          path: |
            ${{ env.GECKO_DIR }}\obj-tb\config.log
            ${{ env.GECKO_DIR }}\obj-tb\config.status
            ${{ env.GECKO_DIR }}\obj-tb\.mozconfig.json
            ${{ env.GECKO_DIR }}\mozconfig-ci
          if-no-files-found: ignore

      - name: Disk space (after)
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table
